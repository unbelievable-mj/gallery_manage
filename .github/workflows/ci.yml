name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: write # 失败时需要在 commit 上回传错误摘要

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: 单测 · Lint · 构建
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: 检出代码
        uses: actions/checkout@v7

      - name: 安装 JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: 配置 Gradle 缓存
        uses: gradle/actions/setup-gradle@v6

      - name: 配置 Android SDK
        uses: android-actions/setup-android@v4

      # API 37 起 Android SDK 按小版本命名，仓库中只有 platforms;android-37.0 / 37.1 / 37.2，
      # 不存在裸的 platforms;android-37。三个小版本全部安装以消除 AGP 解析歧义。
      - name: 安装 SDK 组件
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager --install \
            "platforms;android-37.0" \
            "platforms;android-37.1" \
            "platforms;android-37.2" \
            "build-tools;36.0.0" \
            "build-tools;37.0.0"

      - name: 单元测试
        run: |
          set -o pipefail
          ./gradlew --no-daemon --stacktrace testDebugUnitTest 2>&1 | tee -a "$RUNNER_TEMP/gradle.log"

      - name: 上传测试报告
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: unit-test-report
          path: '**/build/reports/tests/testDebugUnitTest/**'
          if-no-files-found: ignore
          retention-days: 7

      - name: Android Lint
        run: |
          set -o pipefail
          ./gradlew --no-daemon --stacktrace lintDebug 2>&1 | tee -a "$RUNNER_TEMP/gradle.log"

      - name: 上传 Lint 报告
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: lint-report
          path: '**/build/reports/lint-results-debug.html'
          if-no-files-found: ignore
          retention-days: 7

      # 关键：在 PR 阶段就构建一次 release 变体。
      # 这样 R8 混淆 / 资源压缩 / 混淆规则的问题会在这里暴露，
      # 而不是等到打 tag 发版时才炸。此处无签名密钥，会回退到 debug 签名。
      - name: 构建 release 变体（验证 R8）
        run: |
          set -o pipefail
          ./gradlew --no-daemon --stacktrace assembleRelease \
            -PappVersionName=0.0.0-ci \
            -PappVersionCode=1 2>&1 | tee -a "$RUNNER_TEMP/gradle.log"

      - name: 构建 debug 包
        run: |
          set -o pipefail
          ./gradlew --no-daemon --stacktrace assembleDebug 2>&1 | tee -a "$RUNNER_TEMP/gradle.log"

      - name: 上传 debug APK
        uses: actions/upload-artifact@v7
        with:
          name: swipegallery-debug-apk
          path: 'app/build/outputs/apk/debug/*.apk'
          if-no-files-found: error
          retention-days: 14

      # Actions 日志在未认证状态下无法下载（需管理员权限），
      # 因此失败时把错误摘要回传到 commit comment，便于在本地直接读取定位。
      - name: 失败时回传错误摘要
        if: failure() && github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          LOG="$RUNNER_TEMP/gradle.log"
          if [ ! -f "$LOG" ]; then
            echo "未捕获到 Gradle 输出"
            exit 0
          fi
          {
            echo "### Gradle 失败关键行"
            echo
            echo '```text'
            grep -nE "What went wrong|FAILURE:|Caused by:|^e: |error:|Unresolved reference|Could not (find|resolve|determine|create)|> Task .* FAILED|Execution failed" "$LOG" \
              | head -100 || true
            echo '```'
            echo
            echo "### 输出最后 120 行"
            echo
            echo '```text'
            tail -120 "$LOG"
            echo '```'
          } > "$RUNNER_TEMP/body.md"
          gh api "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/comments" \
            -F body=@"$RUNNER_TEMP/body.md" \
            && echo "错误摘要已回传" \
            || echo "回传失败（不影响构建结论）"
