name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: 单测 · Lint · 构建
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: 检出代码
        uses: actions/checkout@v7

      - name: 安装 JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: 配置 Gradle 缓存
        uses: gradle/actions/setup-gradle@v6

      - name: 配置 Android SDK
        uses: android-actions/setup-android@v4

      # 注意：API 37 起 Android SDK 改为带小版本号的命名（android-37.0 / 37.1 / 37.2），
      # 不存在裸的 platforms;android-37。此处固定在 android-36，是当前确定可用的稳定包。
      - name: 安装 SDK 组件
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager --install "platforms;android-36" "build-tools;36.0.0"

      - name: 单元测试
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: 上传测试报告
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: unit-test-report
          path: '**/build/reports/tests/testDebugUnitTest/**'
          if-no-files-found: ignore
          retention-days: 7

      - name: Android Lint
        run: ./gradlew --no-daemon lintDebug

      - name: 上传 Lint 报告
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: lint-report
          path: '**/build/reports/lint-results-debug.html'
          if-no-files-found: ignore
          retention-days: 7

      # 关键：在 PR 阶段就构建一次 release 变体。
      # 这样 R8 混淆 / 资源压缩 / 混淆规则的问题会在这里暴露，
      # 而不是等到打 tag 发版时才炸。此处无签名密钥，会回退到 debug 签名。
      - name: 构建 release 变体（验证 R8）
        run: |
          ./gradlew --no-daemon assembleRelease \
            -PappVersionName=0.0.0-ci \
            -PappVersionCode=1

      - name: 构建 debug 包
        run: ./gradlew --no-daemon assembleDebug

      - name: 上传 debug APK
        uses: actions/upload-artifact@v7
        with:
          name: swipegallery-debug-apk
          path: 'app/build/outputs/apk/debug/*.apk'
          if-no-files-found: error
          retention-days: 14
